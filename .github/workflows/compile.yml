name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            gfortran \
            liblapack-dev \
            libblas-dev \
            make

      - name: Build core tools
        run: |
          # Prefer committed make.linux defaults (no MATLAB) for CI.
          rm -f make.inc
          make gp ivm gplvm

      - name: Smoke help
        run: |
          ./gp -h
          ./ivm -h
          ./gplvm -h
