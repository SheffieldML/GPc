name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            make_fragment: make.linux
          - os: macos-latest
            make_fragment: make.osx
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            gfortran \
            liblapack-dev \
            libblas-dev \
            make

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc openblas libmatio

      - name: Configure platform make fragment
        run: |
          rm -f make.inc
          if [ "${{ matrix.make_fragment }}" = "make.osx" ]; then
            cp make.osx make.inc
          fi

      - name: Build core tools
        run: make gp ivm gplvm

      - name: Smoke help
        run: |
          ./gp -h
          ./ivm -h
          ./gplvm -h
