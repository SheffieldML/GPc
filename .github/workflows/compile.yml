name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            make_fragment: make.linux
          - os: macos-latest
            make_fragment: make.osx
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/ci_apt_install.sh
          ./scripts/ci_apt_install.sh \
            g++ \
            gfortran \
            libopenblas-dev \
            make

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc openblas libmatio

      - name: Configure platform make fragment
        run: |
          rm -f make.inc
          if [ "${{ matrix.make_fragment }}" = "make.osx" ]; then
            cp make.osx make.inc
          fi

      - name: Build core tools
        run: make gp ivm gplvm bgplvm ppa

      - name: Smoke help
        run: |
          ./gp -h
          ./ivm -h
          ./gplvm -h
          ./bgplvm -h
          ./bgplvm learn -h
          ./bgplvm gnuplot -h
          ./ppa -h

  # CIP-002B: Windows MSVC + Intel ifx + OpenBLAS via thin CMake (soft gate).
  # Binary cache: vcpkg files provider + actions/cache (x-gha was removed from vcpkg).
  windows-msvc-cmake:
    name: Windows MSVC CMake (soft)
    runs-on: windows-2022
    continue-on-error: true
    env:
      # Do not use VCPKG_ROOT: ilammy/msvc-dev-cmd overwrites it with the
      # VS-bundled vcpkg under Program Files (clone then fails on non-empty dir).
      GPC_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      GPC_VCPKG_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Pin for stable ABI hashes in the binary cache (bump when upgrading ports).
      GPC_VCPKG_COMMIT: "2025.10.17"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Intel Fortran (ifx)
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: intel
          version: "2025.0"

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      # Split restore/save: actions/cache@v4's implicit post-save only runs when
      # the whole job succeeds, so any Build failure threw away the ~8-12 min
      # OpenBLAS/LAPACK build and every run started cold.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GPC_VCPKG_BINARY_CACHE }}
          key: vcpkg-bin-win-x64-${{ env.GPC_VCPKG_COMMIT }}-openblas-lapack-ref-ifx2025
          restore-keys: |
            vcpkg-bin-win-x64-${{ env.GPC_VCPKG_COMMIT }}-
            vcpkg-bin-win-x64-

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          if exist "%GPC_VCPKG_ROOT%" rmdir /s /q "%GPC_VCPKG_ROOT%"
          git clone --depth 1 --branch %GPC_VCPKG_COMMIT% https://github.com/microsoft/vcpkg.git "%GPC_VCPKG_ROOT%"
          call "%GPC_VCPKG_ROOT%\bootstrap-vcpkg.bat"
          if not exist "%GPC_VCPKG_BINARY_CACHE%" mkdir "%GPC_VCPKG_BINARY_CACHE%"

      - name: Install OpenBLAS + LAPACK (vcpkg)
        shell: cmd
        run: |
          rem vcpkg openblas is NOFORTRAN/no-LAPACK; lapack-reference supplies dpotrf_/dsyev_.
          rem Prefer ifx for the Fortran LAPACK build (on PATH from setup-fortran).
          rem First run populates GPC_VCPKG_BINARY_CACHE; later runs restore via actions/cache.
          set "FC=ifx"
          set "F77=ifx"
          "%GPC_VCPKG_ROOT%\vcpkg.exe" install openblas:x64-windows lapack-reference:x64-windows
          dir "%GPC_VCPKG_ROOT%\installed\x64-windows\lib"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GPC_VCPKG_BINARY_CACHE }}
          key: vcpkg-bin-win-x64-${{ env.GPC_VCPKG_COMMIT }}-openblas-lapack-ref-ifx2025

      - name: Configure CMake (MSVC cl + ifx + OpenBLAS)
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_Fortran_COMPILER=ifx ^
            -DCMAKE_TOOLCHAIN_FILE=%GPC_VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DCMAKE_PREFIX_PATH=%GPC_VCPKG_ROOT%\installed\x64-windows ^
            -DGPC_BUILD_EXTRA_CLIS=ON ^
            -DGPC_BUILD_GP_CLI=ON ^
            -DGPC_USE_MATIO=OFF ^
            -DGPC_BUILD_TESTS=OFF
        shell: cmd

      - name: Build
        run: cmake --build build --parallel
        shell: cmd

      - name: Smoke help
        shell: cmd
        run: |
          set "PATH=%GPC_VCPKG_ROOT%\installed\x64-windows\bin;%PATH%"
          build\gp.exe -h
          build\ivm.exe -h
          build\gplvm.exe -h
          build\bgplvm.exe -h
          build\ppa.exe -h
