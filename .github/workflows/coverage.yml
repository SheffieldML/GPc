# CIP-002E tier 3: main push + workflow_dispatch (not every PR).
# Overlaps Reference tests under gcov; PR correctness stays on reference-tests.yml.
name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          chmod +x scripts/ci_apt_install.sh
          ./scripts/ci_apt_install.sh \
            g++ \
            gfortran \
            libopenblas-dev \
            libmatio-dev \
            lcov \
            make

      - name: Build matio tests with gcov
        run: |
          rm -f make.inc
          make clean || true
          # testSparsePpa: CIP-0026 — exercises CGp::sparsePpaElboGpTerms (CIP-0011 gate).
          # testSvgp: CIP-002A — CSvgp / CAdam / expectedLogLikelihood / gaussHermite.
          # CIP-002D: exhaustive checks for correctness coverage.
          make USE_MATIO=1 COVERAGE=1 CHECKS=full matio-tests bgplvm testSparsePpa testSvgp

      - name: Run matio reference tests
        run: make run-matio-tests

      - name: Run sparse PPA gate (coverage for sparsePpaElboGpTerms)
        run: ./testSparsePpa

      - name: Run SVGP gate (coverage for CSvgp / CAdam / GH probit)
        run: ./testSvgp

      - name: Smoke bgplvm CLI (coverage for bgplvm.cpp)
        run: make run-bgplvm-smoke

      - name: Collect lcov report
        run: |
          # lcov 2.x treats unused exclude patterns and inconsistent gcov
          # counts as hard errors unless ignored.
          lcov --ignore-errors inconsistent,empty \
            --capture --directory . --output-file coverage.info
          # Drop system headers, test drivers, and local fixture helpers.
          lcov --ignore-errors unused \
            --remove coverage.info \
            '/usr/*' \
            '*/test*.cpp' \
            '*/tools/diagDtcvar.cpp' \
            '*/tools/genTestGpDtcvar.cpp' \
            '*/tools/diagPitc.cpp' \
            '*/tools/genTestGpPitc.cpp' \
            --output-file coverage.info
          if lcov --list coverage.info | grep -E '(^|/)test(Matrix|Kern|Noise|Dist|Transform|Ndlutil|Gp|Ivm|CGp|Optimisable)\.cpp'; then
            echo "ERROR: test drivers still present in coverage.info" >&2
            lcov --list coverage.info
            exit 1
          fi
          lcov --list coverage.info

      - name: Enforce CGp.cpp line-rate gate (CIP-0011)
        run: |
          chmod +x scripts/check_cgp_coverage.sh
          CGP_COVERAGE_THRESHOLD=95 ./scripts/check_cgp_coverage.sh coverage.info cgp_coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.info
          flags: matio-tests
          name: ubuntu-matio-gcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
