name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            gfortran \
            liblapack-dev \
            libblas-dev \
            libmatio-dev \
            lcov \
            make

      - name: Build matio tests with gcov
        run: |
          rm -f make.inc
          make clean || true
          make USE_MATIO=1 COVERAGE=1 matio-tests

      - name: Run matio reference tests
        run: make run-matio-tests

      - name: Collect lcov report
        run: |
          lcov --capture --directory . --output-file coverage.info
          # Exclude system headers and test drivers. Patterns must match deep
          # CI paths (/home/runner/work/.../testMatrix.cpp); a single '*/'
          # segment is not enough (CIP-0005 Codecov patch noise).
          lcov --remove coverage.info \
            '/usr/*' \
            '*/test*.cpp' \
            '*/test*.h' \
            '*test*.cpp' \
            --output-file coverage.info
          if lcov --list coverage.info | grep -E 'test(Matrix|Kern|Noise|Dist|Transform|Ndlutil|Gp|Ivm)\.cpp'; then
            echo "ERROR: test drivers still present in coverage.info" >&2
            lcov --list coverage.info
            exit 1
          fi
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.info
          flags: matio-tests
          name: ubuntu-matio-gcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
