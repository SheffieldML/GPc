# CIP-002E tier 2: path-triggered + workflow_dispatch (unchanged policy).
name: Numerical stability

on:
  push:
    branches: [main]
    paths:
      - 'CMatrix.*'
      - 'CKern.*'
      - 'CNoise.*'
      - 'CGp.*'
      - 'CCholAdjoint.*'
      - 'ndlutil.*'
      - 'ndlfortran.*'
      - 'numerical_stability/**'
      - 'makefile'
      - 'make.linux'
      - 'make.osx'
      - '.github/workflows/numerical-stability.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMatrix.*'
      - 'CKern.*'
      - 'CNoise.*'
      - 'CGp.*'
      - 'CCholAdjoint.*'
      - 'ndlutil.*'
      - 'ndlfortran.*'
      - 'numerical_stability/**'
      - 'makefile'
      - 'make.linux'
      - 'make.osx'
      - '.github/workflows/numerical-stability.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # CIP-0019: separate from matio Reference tests. One Ubuntu cell.
  # Strict xfail: unexpected passes (xpassed) fail the job.
  # CIP-001A: METRIC stream + metrics.json baseline artifact + PR trend.
  # Report: job summary + artifact + sticky PR comment (Codecov-like).
  numerical-stability:
    runs-on: ubuntu-latest
    env:
      GPC_NS_CELL: ubuntu-openblas
      GPC_NS_BLAS: openblas
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          chmod +x scripts/ci_apt_install.sh
          ./scripts/ci_apt_install.sh \
            g++ \
            gfortran \
            libopenblas-dev \
            make \
            python3

      - name: Configure platform make fragment
        run: rm -f make.inc

      - name: Build numerical stability suite
        run: make testNumericalStability

      - name: Run suite and capture log
        id: suite
        run: |
          set +e
          ./testNumericalStability > numerical_stability/suite.log 2>&1
          status=$?
          set -e
          cat numerical_stability/suite.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Render report
        if: always() && hashFiles('numerical_stability/suite.log') != ''
        run: |
          python3 numerical_stability/report.py numerical_stability/suite.log \
            --md numerical_stability/report.md \
            --json numerical_stability/outcomes.json \
            --metrics-json numerical_stability/metrics.json \
            --ref "${{ github.sha }}" \
            --github-summary

      - name: Report / compare unit tests
        if: always()
        run: |
          python3 numerical_stability/test_compare.py
          python3 numerical_stability/test_report.py
          python3 numerical_stability/test_compare_metrics.py

      - name: Upload report artifact
        if: always() && hashFiles('numerical_stability/report.md') != ''
        uses: actions/upload-artifact@v6
        with:
          name: numerical-stability-report
          path: |
            numerical_stability/report.md
            numerical_stability/outcomes.json
            numerical_stability/metrics.json
            numerical_stability/suite.log
          retention-days: 30

      # CIP-001A: pin baseline from green main runs (same cell label).
      - name: Upload main metrics baseline
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: numerical-stability-metrics-main
          path: numerical_stability/metrics.json
          retention-days: 90

      - name: Fetch main metrics baseline
        if: always() && github.event_name == 'pull_request' && hashFiles('numerical_stability/metrics.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p numerical_stability/baseline
          # Cross-run: latest successful main workflow that uploaded the baseline artifact.
          RUN_ID=$(gh run list \
            --workflow=numerical-stability.yml \
            --branch=main \
            --status=success \
            --limit=30 \
            --json databaseId \
            --jq '.[0].databaseId' || true)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful main run yet — trend will note empty baseline"
            exit 0
          fi
          # Walk recent runs until the metrics-main artifact is found.
          for id in $(gh run list \
            --workflow=numerical-stability.yml \
            --branch=main \
            --status=success \
            --limit=30 \
            --json databaseId \
            --jq '.[].databaseId'); do
            if gh run download "$id" \
              -n numerical-stability-metrics-main \
              -D numerical_stability/baseline 2>/dev/null; then
              echo "Downloaded baseline from run $id"
              exit 0
            fi
          done
          echo "No numerical-stability-metrics-main artifact on recent main runs"

      - name: Compare metrics vs main baseline
        if: always() && github.event_name == 'pull_request' && hashFiles('numerical_stability/metrics.json') != ''
        run: |
          BASE=numerical_stability/baseline/metrics.json
          python3 numerical_stability/compare_metrics.py \
            "$BASE" numerical_stability/metrics.json \
            --md numerical_stability/trend.md \
            --baseline-ref main \
            --head-ref "${{ github.sha }}" \
            || true
          if [ -f numerical_stability/trend.md ]; then
            echo "" >> numerical_stability/report.md
            cat numerical_stability/trend.md >> numerical_stability/report.md
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat numerical_stability/trend.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Comment report on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('numerical_stability/report.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('numerical_stability/report.md', 'utf8');
            const marker = '<!-- cip0019-numerical-stability-report -->';
            const header = marker + '\n';
            const full = header + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full
              });
            }
