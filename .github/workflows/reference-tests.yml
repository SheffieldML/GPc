# CIP-002E tier 1: hard merge gate (matio reference suite).
# paths-ignore: skip pure governance/docs PRs.
name: Reference tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'cip/**'
      - 'backlog/**'
      - 'tenets/**'
      - 'coe/**'
      - 'requirements/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'cip/**'
      - 'backlog/**'
      - 'tenets/**'
      - 'coe/**'
      - 'requirements/**'
      - '*.md'
      - '**/*.md'

jobs:
  matio-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            make_fragment: make.linux
          - os: macos-latest
            make_fragment: make.osx
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/ci_apt_install.sh
          ./scripts/ci_apt_install.sh \
            g++ \
            gfortran \
            libopenblas-dev \
            libmatio-dev \
            make

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc openblas libmatio

      - name: Configure platform make fragment
        run: |
          rm -f make.inc
          if [ "${{ matrix.make_fragment }}" = "make.osx" ]; then
            cp make.osx make.inc
          fi

      - name: Build matio reference tests
        run: |
          make clean || true
          # CIP-002D: exhaustive checks (not the cheap default GPC_CHECKS=1).
          make USE_MATIO=1 CHECKS=full matio-tests

      - name: Run matio reference tests
        run: make USE_MATIO=1 CHECKS=full run-matio-tests
