name: Reference tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  matio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            gfortran \
            liblapack-dev \
            libblas-dev \
            libmatio-dev \
            make

      - name: Build matio reference tests
        run: |
          rm -f make.inc
          make USE_MATIO=1 matio-tests

      - name: Run matio reference tests
        run: |
          set -e
          ./testMatrix
          ./testNdlutil
          ./testTransform
          ./testDist
          ./testNoise
          ./testKern
