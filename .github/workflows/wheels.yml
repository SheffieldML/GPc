# CIP-002C: binary wheels via cibuildwheel (soft gate until soak).
# Phase B: delocate/auditwheel self-contained OpenBLAS; pytest on repaired wheel.
# Makefile Compile / Reference remain the hard native gates.
#
# CIP-002E tier 2+3: path-triggered on PR/main + workflow_dispatch.
# Not an every-PR hard gate — packaging surface only (or manual run).
name: Wheels

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wheels.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # macos-15: brew bottles typically minOS 15 (better than macos-latest/26).
        # wheels.yml still raises MACOSX_DEPLOYMENT_TARGET to match bottle minOS.
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS OpenBLAS + gfortran; align deployment target
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openblas gcc cmake
          CXX="$(/bin/ls "$(brew --prefix gcc)/bin"/g++-[0-9]* | sort -V | tail -1)"
          FC="$(/bin/ls "$(brew --prefix gcc)/bin"/gfortran-[0-9]* | sort -V | tail -1)"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "FC=$FC" >> "$GITHUB_ENV"
          echo "CC=$CXX" >> "$GITHUB_ENV"
          # delocate rejects brew dylibs whose minOS exceeds the wheel target.
          # Set MACOSX_DEPLOYMENT_TARGET to the max minos of OpenBLAS + libgfortran.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, re, subprocess
          from pathlib import Path

          def minos(path: Path) -> tuple[int, int]:
              path = path.resolve()
              out = subprocess.check_output(["otool", "-l", str(path)], text=True)
              m = re.search(r"\bminos\s+(\d+)\.(\d+)", out)
              if not m:
                  raise SystemExit(f"no minos in otool -l {path}")
              return int(m.group(1)), int(m.group(2))

          brew_openblas = Path(subprocess.check_output(
              ["brew", "--prefix", "openblas"], text=True).strip())
          brew_gcc = Path(subprocess.check_output(
              ["brew", "--prefix", "gcc"], text=True).strip())
          libs = [
              brew_openblas / "lib" / "libopenblas.dylib",
              brew_gcc / "lib" / "gcc" / "current" / "libgfortran.5.dylib",
          ]
          best = max(minos(p) for p in libs)
          target = f"{best[0]}.{best[1]}"
          print(f"MACOSX_DEPLOYMENT_TARGET={target}")
          print(f"Aligned macOS deployment target to brew bottle minOS {target}", file=__import__("sys").stderr)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: warn
