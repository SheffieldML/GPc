# Codecov settings for GPc (CIP-0004 / CIP-0005).
# Library coverage comes from the matio reference suite under gcov.

coverage:
  status:
    project:
      default:
        target: auto
        # Allow a small project dip when the measured library surface changes
        # (e.g. CIP-0005 test-driver exclude). Prefer covering new modules
        # (testGp exercises CGp FTC/DTC/DTCVAR/FITC) over raising this further.
        # Patch coverage is the gate for new library lines.
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 0%

ignore:
  - "test*.cpp"
  - "test*.h"
  - "**/test*.cpp"
  - "**/test*.h"
  # Local DTCVAR diagnostic / fixture stampers (not part of matio-tests).
  - "diagDtcvar.cpp"
  - "genTestGpDtcvar.cpp"
