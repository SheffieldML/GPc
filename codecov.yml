# Codecov settings for GPc (CIP-0004 / CIP-0005).
# Library coverage comes from the matio reference suite under gcov.

coverage:
  status:
    project:
      default:
        target: auto
        # Allow a one-time project dip when the measured library surface grows
        # without a matching hit rate. CIP-0005 used 2% when test drivers left
        # the upload; enabling testGp in matio-tests pulls CGp.cpp (and
        # CMltools) into gcov — PR #27 saw ~-4% (62.3%→58.2%) while patch
        # stayed green. Patch coverage remains the gate for new library lines.
        threshold: 5%
    patch:
      default:
        target: auto
        threshold: 0%

ignore:
  - "test*.cpp"
  - "test*.h"
  - "**/test*.cpp"
  - "**/test*.h"
  # Local DTCVAR diagnostic / fixture stampers (not part of matio-tests).
  - "diagDtcvar.cpp"
  - "genTestGpDtcvar.cpp"
