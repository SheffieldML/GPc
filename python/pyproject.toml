[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
  "numpy",
]
build-backend = "scikit_build_core.build"

[project]
name = "gpc"
version = "0.1.0a1"
description = "Light Python façade over SheffieldML GPc (CIP-001D)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]
examples = ["matplotlib", "pods", "jupyter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CIP-0020 Phase B: build native _gpc via repo-root CMake (libgp + Fortran + OpenBLAS).
[tool.scikit-build]
cmake.source-dir = ".."
wheel.packages = ["gpc"]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
GPC_BUILD_PYTHON = "ON"
GPC_BUILD_GP_CLI = "OFF"
GPC_BUILD_EXTRA_CLIS = "OFF"
