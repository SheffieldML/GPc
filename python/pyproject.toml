[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
  # Pin below 2.5: numpy 2.5+ sdists need GCC >= 10.3; manylinux_2_28 is 10.2.1.
  # Prefer binary wheels in cibuildwheel (PIP_ONLY_BINARY=numpy).
  "numpy>=2.0,<2.5",
]
build-backend = "scikit_build_core.build"

[project]
# CIP-002C Phase C: distribution name locked to `gpc` (matches import).
# Checked 2026-11-19: pypi.org/pypi/gpc and sheffieldml-gpc both 404 (available).
name = "gpc"
version = "0.1.0a1"
description = "Light Python façade over SheffieldML GPc (CIP-001D)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Neil Lawrence" }]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/SheffieldML/GPc"
Repository = "https://github.com/SheffieldML/GPc"
Issues = "https://github.com/SheffieldML/GPc/issues"
Documentation = "https://github.com/SheffieldML/GPc/blob/main/python/README.md"

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]
examples = ["matplotlib", "pods", "jupyter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CIP-0020 Phase B: build native _gpc via repo-root CMake (libgp + Fortran + OpenBLAS).
[tool.scikit-build]
cmake.source-dir = ".."
wheel.packages = ["gpc"]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
GPC_BUILD_PYTHON = "ON"
GPC_BUILD_GP_CLI = "OFF"
GPC_BUILD_EXTRA_CLIS = "OFF"
CMAKE_BUILD_TYPE = "Release"

# CIP-002C: cibuildwheel (run from repo root with --package-dir python).
# Phase B: default auditwheel (Linux) + delocate (macOS). MACOSX_DEPLOYMENT_TARGET
# must match Homebrew bottle minOS (set in wheels.yml from otool); lower targets
# need rebuilding OpenBLAS/gfortran from source (later), not stock brew bottles.
[tool.cibuildwheel]
build = "cp31{0,1,2,3}-*"
skip = "pp* *-win* *-musllinux*"
archs = ["auto64"]
test-extras = ["test"]
# Clear pythonpath from pyproject (local editable uses pythonpath=["."]); otherwise
# pytest imports the source tree gpc/ without _gpc instead of the installed wheel.
test-command = [
  "python {package}/scripts/check_native_deps.py",
  "pytest {package}/tests -q -o pythonpath=",
]
# Soft matrix: no Windows until Phase D (CIP-002B).
environment = { PIP_ONLY_BINARY = "numpy", OPENBLAS_NUM_THREADS = "1" }

[tool.cibuildwheel.linux]
before-all = [
  "dnf install -y openblas-devel gcc-gfortran cmake || yum install -y openblas-devel gcc-gfortran cmake",
]
manylinux-x86_64-image = "manylinux_2_28"
# Default repair-wheel-command = auditwheel (bundles OpenBLAS + libgfortran).
environment = { CMAKE_BUILD_TYPE = "Release", PIP_ONLY_BINARY = "numpy", OPENBLAS_NUM_THREADS = "1" }

[tool.cibuildwheel.macos]
# Default repair = delocate-wheel. Deployment target comes from the Actions env
# (aligned to brew bottle minOS). Do not set a stale low target here.
environment = { CMAKE_BUILD_TYPE = "Release", PIP_ONLY_BINARY = "numpy", OPENBLAS_NUM_THREADS = "1" }
